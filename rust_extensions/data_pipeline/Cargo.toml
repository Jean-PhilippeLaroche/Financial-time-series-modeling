[package]
name = "data_pipeline"
version = "0.1.0"
edition = "2024"

[lib]
name = "data_pipeline"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
ndarray = "0.15"
rayon = "1.8"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
